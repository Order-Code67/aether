[package]
name = "aether-ground-station"
version = "0.4.0"
description = "Aether Ground Station — modular ground station platform"
authors = ["Aether"]
edition = "2021"

[lib]
name = "aether_ground_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.6"
nusb = "0.1"
if-addrs = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
