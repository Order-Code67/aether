[[permission]]
identifier = "allow-platformio"
description = "Enables PlatformIO detect/inspect/run/cancel commands."
commands.allow = [
  "pio_detect",
  "python_detect",
  "pio_install_core",
  "open_windows_optional_features",
  "pio_inspect_project",
  "pio_run",
  "pio_cancel",
  "pio_is_running",
  "pio_project_init",
  "pio_lib_search",
  "pio_lib_install",
  "pio_lib_uninstall",
  "pio_lib_list",
  "pio_cache_status",
  "pio_prepare_offline_cache"
]
