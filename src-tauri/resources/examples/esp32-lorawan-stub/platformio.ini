; Aether LoRaWAN OTAA — Join + periodic uplink (RadioLib).
; 1) Fill DevEUI / AppKey (and JoinEUI if required) below or via build_flags.
; 2) Pick board env. 3) Match region to your TTN / ChirpStack application.
; 4) On TTN: enable “Resets DevNonces” while developing.
; Default region EU868. For US915 set Region + subBand=2; RU864 uses EU868-like RU864 band if available.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib
	bblanchon/ArduinoJson
build_flags =
	-DAETHER_LORA_REGION_EU868
	; --- replace with your console values (hex) ---
	; -DRADIOLIB_LORAWAN_DEV_EUI=0x0123456789ABCDEF
	; -DRADIOLIB_LORAWAN_JOIN_EUI=0x0000000000000000
	; AppKey / NwkKey as 16 bytes — see src/config.h

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
build_flags =
	${env.build_flags}
	-DAETHER_RADIO_SX126X=1
	-DAETHER_LORA_NSS=8
	-DAETHER_LORA_DIO=14
	-DAETHER_LORA_RST=12
	-DAETHER_LORA_BUSY=13
	-DAETHER_LORA_SCK=9
	-DAETHER_LORA_MISO=11
	-DAETHER_LORA_MOSI=10

[env:heltec_wifi_lora_32_V2]
platform = espressif32
board = heltec_wifi_lora_32_V2
build_flags =
	${env.build_flags}
	-DAETHER_RADIO_SX127X=1
	-DAETHER_LORA_NSS=18
	-DAETHER_LORA_DIO=26
	-DAETHER_LORA_RST=14
	-DAETHER_LORA_BUSY=-1
	-DAETHER_LORA_SCK=5
	-DAETHER_LORA_MISO=19
	-DAETHER_LORA_MOSI=27

[env:ttgo-lora32-v2]
platform = espressif32
board = ttgo-lora32-v2
build_flags =
	${env.build_flags}
	-DAETHER_RADIO_SX127X=1
	-DAETHER_LORA_NSS=18
	-DAETHER_LORA_DIO=26
	-DAETHER_LORA_RST=14
	-DAETHER_LORA_BUSY=-1
	-DAETHER_LORA_SCK=5
	-DAETHER_LORA_MISO=19
	-DAETHER_LORA_MOSI=27

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
	${env.build_flags}
	-DAETHER_RADIO_SX127X=1
	-DAETHER_LORA_NSS=5
	-DAETHER_LORA_DIO=26
	-DAETHER_LORA_RST=14
	-DAETHER_LORA_BUSY=-1
	-DAETHER_LORA_SCK=18
	-DAETHER_LORA_MISO=19
	-DAETHER_LORA_MOSI=23
