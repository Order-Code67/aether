; ESP32-CAM (AI-Thinker) — PlatformIO board id: esp32cam
; Camera / PSRAM notes: see README.md

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix=fpv4-sp-d16
	-mfpu=fpv4-sp-d16
board_build.partitions = huge_app.csv
