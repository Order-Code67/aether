; Mega + RFM95 / SX1276 on hardware SPI. Default EU868.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib
	bblanchon/ArduinoJson
	adafruit/Adafruit GFX Library
	adafruit/Adafruit SSD1306
	adafruit/Adafruit BusIO
	olikraus/U8g2
build_flags =
	-DAETHER_LORA_REGION_EU868
	-DAETHER_LORA_FREQ=868.1
	-DAETHER_LORA_SF=7
	-DAETHER_LORA_BW=125.0
	-DAETHER_LORA_NSS=10
	-DAETHER_LORA_DIO=2
	-DAETHER_LORA_RST=9
	-DAETHER_LORA_BUSY=-1
	-DAETHER_RADIO_SX127X=1