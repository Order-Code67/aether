; Aether LoRa example — pick env for your board. Default region EU868 (868.1 MHz).
; Change AETHER_LORA_FREQ / REGION_* for US915 (915.0) or RU864 (864.1).
; Pair with esp32-lora-rx (same region, SF, BW).

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib
	bblanchon/ArduinoJson
	adafruit/Adafruit GFX Library
	adafruit/Adafruit SSD1306
	adafruit/Adafruit BusIO
	olikraus/U8g2
build_flags =
	-DAETHER_LORA_REGION_EU868
	-DAETHER_LORA_FREQ=868.1
	-DAETHER_LORA_SF=7
	-DAETHER_LORA_BW=125.0
	-DAETHER_LORA_NSS=8
	-DAETHER_LORA_DIO=14
	-DAETHER_LORA_RST=12
	-DAETHER_LORA_BUSY=13
	-DAETHER_LORA_SCK=9
	-DAETHER_LORA_MISO=11
	-DAETHER_LORA_MOSI=10
	-DAETHER_OLED_SDA=17
	-DAETHER_OLED_SCL=18
	-DAETHER_OLED_RST=21
	-DAETHER_RADIO_SX126X=1

